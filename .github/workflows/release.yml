name: 'Release Multiplataforma (Windows, Linux & Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências Linux (WebKitGTK e bibliotecas do sistema)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Compilar e Publicar Release com Assinatura Digital
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LinkFetcher v__VERSION__'
          releaseBody: 'Veja as novidades e melhorias desta versão do LinkFetcher.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: universal
            filter: "arm64-v8a,armeabi-v7a,x86,x86_64"
            srcdir: universal
            srcfile: app-universal-release.apk
            file: LinkFetcher.apk
          - abi: arm64
            filter: "arm64-v8a"
            srcdir: arm64
            srcfile: app-arm64-release.apk
            file: LinkFetcher-arm64.apk
          - abi: armv7
            filter: "armeabi-v7a"
            srcdir: arm
            srcfile: app-arm-release.apk
            file: LinkFetcher-armv7.apk
          - abi: x86_64
            filter: "x86_64"
            srcdir: x86_64
            srcfile: app-x86_64-release.apk
            file: LinkFetcher-x86_64.apk
          - abi: x86
            filter: "x86"
            srcdir: x86
            srcfile: app-x86-release.apk
            file: LinkFetcher-x86.apk
    runs-on: 'ubuntu-22.04'
    env:
      LINKFETCHER_ABIS: ${{ matrix.filter }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Java 17 (AGP)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK + NDK (manual)
        # setup-android@v3 quebra sozinho (`sdkmanager tools` não existe
        # mais): cmdline-tools direto do Google, sem intermediário.
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          # GITHUB_PATH só vale para os steps seguintes: neste usa absoluto.
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Instalar Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkfetcher-release.jks"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/linkfetcher-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release Android (APK + AAB assinados)
        # Matrix por ABI via LINKFETCHER_ABIS: cada job gera um universal
        # enxuto (1 ABI). NÃO rodar gradle avulso: rustBuild fora da
        # orquestração do Tauri panica (WebSocket indisponível).
        run: npx tauri android build

      - name: Arquivar mapping R8 (deobfuscar crashes futuros)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping-${{ matrix.abi }}-${{ github.ref_name }}
          path: src-tauri/gen/android/app/build/outputs/mapping/
          retention-days: 90

      - name: Renomear artefato (1 APK por job da matrix)
        # Cada job gera SÓ sua ABI em apk/<srcdir>/release/. Falha alto se
        # faltar (melhor CI vermelho que release capenga).
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs
          cp "$APK_DIR/apk/${{ matrix.srcdir }}/release/${{ matrix.srcfile }}" "$APK_DIR/${{ matrix.file }}"
          ls -la "$APK_DIR/${{ matrix.file }}"
          if [ "${{ matrix.abi }}" = "universal" ]; then
            cp "$APK_DIR/bundle/universalRelease/app-universal-release.aab" "$APK_DIR/LinkFetcher.aab"
            ls -la "$APK_DIR/LinkFetcher.aab"
          fi

      - name: Aguardar release existir (job desktop cria)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            echo "aguardando release... ($i/40)"
            sleep 30
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null

      - name: Anexar APK/AAB à release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs
          FILES="$APK_DIR/${{ matrix.file }}"
          if [ "${{ matrix.abi }}" = "universal" ]; then
            FILES="$FILES $APK_DIR/LinkFetcher.aab"
          fi
          # shellcheck disable=SC2086
          gh release upload "${GITHUB_REF_NAME}" $FILES --clobber
