name: 'Release Multiplataforma (Windows, Linux & Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências Linux (WebKitGTK e bibliotecas do sistema)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Compilar e Publicar Release com Assinatura Digital
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LinkFetcher v__VERSION__'
          releaseBody: 'Veja as novidades e melhorias desta versão do LinkFetcher.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Java 17 (AGP)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK + NDK (manual)
        # setup-android@v3 quebra sozinho (`sdkmanager tools` não existe
        # mais): cmdline-tools direto do Google, sem intermediário.
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          # GITHUB_PATH só vale para os steps seguintes: neste usa absoluto.
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Instalar Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkfetcher-release.jks"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/linkfetcher-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release Android (APK + AAB assinados)
        run: npx tauri android build

      - name: Arquivar mapping R8 (deobfuscar crashes futuros)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping-${{ github.ref_name }}
          path: src-tauri/gen/android/app/build/outputs/mapping/
          retention-days: 90

      - name: Empacotar splits por ABI
        # O `tauri android build` garante o universal; os splits vêm daqui
        # (incremental: Rust/Kotlin já compilados, só empacota).
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleArmRelease assembleArm64Release assembleX86Release assembleX86_64Release

      - name: Renomear artefatos
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs
          # Splits por ABI (~70-90 MB) + universal (~244 MB, curinga).
          # Nomes curtos abraçados pelo AndroidUpdater (com fallback p/ universal).
          # Falha alto se algum split faltar: melhor CI vermelho que release
          # sem o APK do aparelho do usuário.
          cp "$APK_DIR/apk/arm64/release/app-arm64-release.apk" "$APK_DIR/LinkFetcher-arm64.apk"
          cp "$APK_DIR/apk/arm/release/app-arm-release.apk" "$APK_DIR/LinkFetcher-armv7.apk"
          cp "$APK_DIR/apk/x86_64/release/app-x86_64-release.apk" "$APK_DIR/LinkFetcher-x86_64.apk"
          cp "$APK_DIR/apk/x86/release/app-x86-release.apk" "$APK_DIR/LinkFetcher-x86.apk"
          cp "$APK_DIR/apk/universal/release/app-universal-release.apk" "$APK_DIR/LinkFetcher.apk"
          cp "$APK_DIR/bundle/universalRelease/app-universal-release.aab" "$APK_DIR/LinkFetcher.aab"
          ls -la "$APK_DIR"/LinkFetcher*.apk "$APK_DIR"/LinkFetcher.aab

      - name: Aguardar release existir (job desktop cria)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            echo "aguardando release... ($i/40)"
            sleep 30
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null

      - name: Anexar APK/AAB à release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs
          gh release upload "${GITHUB_REF_NAME}" \
            "$APK_DIR/LinkFetcher-arm64.apk" \
            "$APK_DIR/LinkFetcher-armv7.apk" \
            "$APK_DIR/LinkFetcher-x86_64.apk" \
            "$APK_DIR/LinkFetcher-x86.apk" \
            "$APK_DIR/LinkFetcher.apk" \
            "$APK_DIR/LinkFetcher.aab" \
            --clobber
