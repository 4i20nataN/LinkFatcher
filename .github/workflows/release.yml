name: 'Release Multiplataforma (Windows, Linux & Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências Linux (WebKitGTK e bibliotecas do sistema)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Compilar e Publicar Release com Assinatura Digital
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LinkFetcher v__VERSION__'
          releaseBody: 'Veja as novidades e melhorias desta versão do LinkFetcher.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Java 17 (AGP)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar platform, build-tools e NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Instalar Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar Dependências do Frontend
        run: npm ci

      - name: Restaurar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linkfetcher-release.jks"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/linkfetcher-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release Android (APK + AAB assinados)
        run: npx tauri android build

      - name: Renomear artefatos com a versão
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_DIR=src-tauri/gen/android/app/build/outputs
          cp "$APK_DIR/apk/universal/release/app-universal-release.apk" \
            "$APK_DIR/LinkFetcher_${VERSION}_android-universal.apk"
          cp "$APK_DIR/bundle/universalRelease/app-universal-release.aab" \
            "$APK_DIR/LinkFetcher_${VERSION}_android-universal.aab"

      - name: Aguardar release existir (job desktop cria)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            echo "aguardando release... ($i/40)"
            sleep 30
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null

      - name: Anexar APK/AAB à release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_DIR=src-tauri/gen/android/app/build/outputs
          gh release upload "${GITHUB_REF_NAME}" \
            "$APK_DIR/LinkFetcher_${VERSION}_android-universal.apk" \
            "$APK_DIR/LinkFetcher_${VERSION}_android-universal.aab" \
            --clobber
