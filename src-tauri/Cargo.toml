[package]
name = "linkfetcher"
version = "1.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
zip = "2"
tar = "0.4"
lzma-rs = "0.3"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Produto final: binário menor e decode xz mais rápido no instalado.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Dev: otimiza só o gargalo do setup (decode xz single-thread) sem
# prejudicar o tempo de compilação/incrementalidade do resto.
[profile.dev.package.lzma-rs]
opt-level = 2
